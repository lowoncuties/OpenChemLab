services:
  lcms-spectrogram:
    build:
      context: .
      target: ${DOCKER_BUILD_TARGET:-runtime}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: lcms-spectrogram:${APP_IMAGE_TAG:-latest}
    container_name: lcms-spectrogram
    restart: unless-stopped
    ports:
      - "${LCMS_HTTP_PORT:-8000}:8000"
    environment:
      LCMS_HOST: 0.0.0.0
      LCMS_PORT: 8000
      LCMS_DATA_DIR: /app/.data/sessions
      LCMS_CORS_ORIGINS: ${LCMS_CORS_ORIGINS:-}
    volumes:
      - lcms_data:/app/.data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  lcms_data:
